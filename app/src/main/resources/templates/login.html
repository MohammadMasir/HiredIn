<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-4">Login to HiredIn</h2>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold">Username</label>
                <input type="text" name="username" class="w-full border px-4 py-2 rounded-lg" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-bold">Password</label>
                <input type="password" name="password" class="w-full border px-4 py-2 rounded-lg" required>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700">
                Login
            </button>
        </form>

        <!-- Show error message if login fails -->
        <div th:if="${param.error}" class="mt-4 text-red-600 text-center">
            Invalid username or password
        </div>

        <!-- Show logout message if user logged out -->
        <div th:if="${param.logout}" class="mt-4 text-green-600 text-center">
            You have been logged out.
        </div>

        <!-- Show registration success message -->
        <div th:if="${param.registered}" class="mt-4 text-green-600 text-center">
            Registration successful! Please login.
        </div>

        <p class="text-center mt-4 text-gray-600">
            Don't have an account? <a href="/register" class="text-blue-600 font-bold">Register</a>
        </p>
    </div>
</body>
</html>
