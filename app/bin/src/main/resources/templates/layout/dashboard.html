<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Welcome to Your Dashboard</h2>

    <p>Hello, <span th:text="${#httpServletRequest.remoteUser}"></span>!</p>

    <!-- Display user roles -->
    <p>Your Roles: 
        <span th:each="role : ${#authentication.authorities}" th:text="${role}"></span>
    </p>

    <!-- Logout button -->
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
