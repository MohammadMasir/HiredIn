<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HiredIn</title>
    <link rel="stylesheet" href="/css/register.css">
    <script src="https://cdn.tailwindcss.com"></script> <!-- Using Tailwind CSS -->
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-4">Create an Account</h2>

        <!-- Registration Form -->
        <form th:action="@{/register}" method="post">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold">Username</label>
                <input type="text" name="username" class="w-full border px-4 py-2 rounded-lg" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-bold">Email</label>
                <input type="email" name="email" class="w-full border px-4 py-2 rounded-lg" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-bold">Password</label>
                <input type="password" name="password" class="w-full border px-4 py-2 rounded-lg" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700">
                Register
            </button>
        </form>

        <p class="text-center mt-4 text-gray-600">
            Already have an account? <a href="/login" class="text-blue-600 font-bold">Login</a>
        </p>
    </div>

</body>
</html>
