<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiredIn - Home</title>
    <link rel="stylesheet" href="/css/style.css"> <!-- Link to external CSS -->
    <script src="https://cdn.tailwindcss.com"></script> <!-- Using Tailwind for styling -->
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-600 p-4 shadow-md flex justify-between items-center">
        <div class="text-white text-2xl font-bold">HiredIn</div>
		<div th:if="${user == null}" class="space-x-4">
		    <a href="/login" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold">Login</a>
		    <a href="/register" class="bg-yellow-400 text-white px-4 py-2 rounded-lg font-semibold">Register</a> <!-- Changed from /signup to /register -->
		</div>
    </nav>

    <!-- Main Section -->
    <div class="container mx-auto mt-20 px-4">
        <div class="flex flex-col space-y-6">
            <a href="/post-job" class="bg-green-500 text-white text-xl px-6 py-3 rounded-lg shadow-lg w-1/3 text-center">
                Hire Talent
            </a>
            <a href="/view-jobs" class="bg-blue-500 text-white text-xl px-6 py-3 rounded-lg shadow-lg w-1/3 text-center">
                View Jobs
            </a>
        </div>
    </div>

</body>
</html>
