<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Welcome to Your Dashboard</h2>

    <p>Hello, <span th:text="${#httpServletRequest.remoteUser}"></span>!</p>

	<!-- Display user roles with null check -->
	<p>Your Roles:
	    <span th:if="${roles != null}" th:each="role : ${roles}" th:text="${role} + ' '">ROLE</span>
	    <span th:if="${roles == null}">No roles assigned</span>
	</p>

    <!-- Logout button -->
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
